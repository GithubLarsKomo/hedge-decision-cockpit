services:
  app:
    image: hedge-decision-cockpit-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hedge-decision-app
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/hedge.db
      N8N_INGEST_TOKEN: ${N8N_INGEST_TOKEN}
      FRED_API_KEY: ${FRED_API_KEY}
      DASHBOARD_BASIC_AUTH_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  fred-scheduler:
    image: hedge-decision-cockpit-app
    container_name: hedge-decision-fred-scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      N8N_INGEST_TOKEN: ${N8N_INGEST_TOKEN}
      FRED_SYNC_URL: http://app:3000/api/market-data/fred/sync
      FRED_SYNC_TIME: ${FRED_SYNC_TIME:-22:30}
      FRED_SYNC_POLL_SECONDS: ${FRED_SYNC_POLL_SECONDS:-60}
      TZ: ${FRED_SYNC_TIMEZONE:-Europe/Berlin}
    volumes:
      - ./data:/app/data
    entrypoint:
      - ./fred-scheduler.sh
    healthcheck:
      disable: true

  legacy-db:
    profiles: ["migration"]
    image: mariadb:11.8
    container_name: hedge-decision-legacy-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-hedge_decision}
      MARIADB_USER: ${MARIADB_USER:-hedge_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - hedge-decision-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p"${MARIADB_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  # Legacy volume retained only for the one-time MariaDB -> SQLite migration profile.
  # Normal `docker compose up` does not start MariaDB.
  hedge-decision-db-data:
