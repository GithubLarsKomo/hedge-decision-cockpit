name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hedge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hedge
      N8N_INGEST_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Generate Prisma client
        run: npm run prisma:generate >/dev/null
      - name: Apply Prisma schema
        run: npx prisma db push --skip-generate >/dev/null
      - name: Typecheck
        run: npm run typecheck >/dev/null
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test >/dev/null
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build >build.log 2>&1
      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 40 build.log
          exit 1
      - name: Runtime smoke test
        shell: bash
        run: |
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi
          (
            cd .next/standalone
            HOSTNAME=127.0.0.1 PORT=3000 DATABASE_URL="$DATABASE_URL" node server.js
          ) >runtime.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:runtime
      - name: Upload runtime log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log
          path: runtime.log
          if-no-files-found: ignore
      - name: Build production container
        run: docker build --tag hedge-decision-cockpit:ci .
      - name: Container smoke test
        shell: bash
        run: |
          docker run --rm --detach \
            --name hedge-decision-cockpit-ci \
            --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env PORT=3100 \
            hedge-decision-cockpit:ci >container.id
          trap 'docker logs hedge-decision-cockpit-ci >container.log 2>&1 || true; docker stop hedge-decision-cockpit-ci >/dev/null 2>&1 || true' EXIT
          SMOKE_TEST_BASE_URL=http://127.0.0.1:3100 npm run test:runtime
      - name: Upload container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-log
          path: container.log
          if-no-files-found: ignore
