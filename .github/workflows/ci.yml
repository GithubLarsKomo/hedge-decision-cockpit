name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hedge
      N8N_INGEST_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Generate Prisma client
        run: npm run prisma:generate >/dev/null
      - name: Typecheck
        run: npm run typecheck >/dev/null
      - name: Lint
        run: npm run lint >/dev/null
      - name: Test
        run: npm test >/dev/null
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -n 120
