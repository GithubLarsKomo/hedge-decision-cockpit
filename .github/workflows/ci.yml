name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      N8N_INGEST_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run prisma:generate >/dev/null
      - name: Apply Prisma schema
        run: npx prisma db push --skip-generate >/dev/null
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build >build.log 2>&1
      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 40 build.log
          exit 1
      - name: Runtime smoke test
        shell: bash
        run: |
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi
          (
            cd .next/standalone
            HOSTNAME=127.0.0.1 PORT=3000 DATABASE_URL="$DATABASE_URL" node server.js
          ) >runtime.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          npm run test:runtime
      - name: Upload runtime log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log
          path: runtime.log
          if-no-files-found: ignore
      - name: Build production container
        run: docker build --tag hedge-decision-cockpit:ci .
      - name: Scan production container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hedge-decision-cockpit:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hedge-decision-cockpit:ci
          format: cyclonedx
          output: hedge-decision-cockpit.cdx.json
          exit-code: '0'
      - name: Verify CycloneDX SBOM
        run: npm run verify:sbom
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hedge-decision-cockpit:ci
          format: spdx-json
          output: hedge-decision-cockpit.spdx.json
          exit-code: '0'
      - name: Verify SPDX SBOM
        run: node scripts/verify-spdx-sbom.mjs
      - name: Verify SBOM cross-format consistency
        run: node scripts/verify-sbom-consistency.mjs
      - name: Generate SBOM inventory summary
        run: npm run generate:sbom-summary
      - name: Generate provenance metadata
        run: node scripts/generate-container-provenance.mjs
      - name: Verify provenance policy
        run: npm run verify:provenance
      - name: Generate supply-chain evidence index
        run: npm run generate:supply-chain-index
      - name: Verify supply-chain evidence index
        run: npm run verify:supply-chain-index
      - name: Generate and verify integrity manifest
        shell: bash
        run: |
          sha256sum \
            hedge-decision-cockpit.cdx.json \
            hedge-decision-cockpit.spdx.json \
            hedge-decision-cockpit.sbom-summary.json \
            hedge-decision-cockpit.provenance.json \
            hedge-decision-cockpit.intoto.json \
            hedge-decision-cockpit.supply-chain-index.json \
            > hedge-decision-cockpit.sha256
          sha256sum --check hedge-decision-cockpit.sha256
      - name: Package and verify supply-chain evidence bundle
        shell: bash
        run: |
          files=(
            hedge-decision-cockpit.cdx.json
            hedge-decision-cockpit.spdx.json
            hedge-decision-cockpit.sbom-summary.json
            hedge-decision-cockpit.provenance.json
            hedge-decision-cockpit.intoto.json
            hedge-decision-cockpit.supply-chain-index.json
            hedge-decision-cockpit.sha256
          )
          archive=hedge-decision-cockpit.supply-chain-evidence.tar.gz
          candidate="${archive}.candidate"
          tar_args=(--sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner)
          tar "${tar_args[@]}" -czf "$archive" "${files[@]}"
          tar "${tar_args[@]}" -czf "$candidate" "${files[@]}"
          cmp --silent "$archive" "$candidate"
          rm "$candidate"
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum --check "${archive}.sha256"
          test "$(tar -tzf "$archive" | wc -l)" -eq "${#files[@]}"
          rm -rf .evidence-check
          mkdir .evidence-check
          tar -xzf "$archive" -C .evidence-check
          (cd .evidence-check && sha256sum --check hedge-decision-cockpit.sha256)
      - name: Upload production supply-chain metadata
        uses: actions/upload-artifact@v4
        with:
          name: production-container-supply-chain
          path: |
            hedge-decision-cockpit.cdx.json
            hedge-decision-cockpit.spdx.json
            hedge-decision-cockpit.sbom-summary.json
            hedge-decision-cockpit.provenance.json
            hedge-decision-cockpit.intoto.json
            hedge-decision-cockpit.supply-chain-index.json
            hedge-decision-cockpit.sha256
            hedge-decision-cockpit.supply-chain-evidence.tar.gz
            hedge-decision-cockpit.supply-chain-evidence.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Attest supply-chain evidence bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: hedge-decision-cockpit.supply-chain-evidence.tar.gz
      - name: Verify non-root container user
        run: test "$(docker image inspect hedge-decision-cockpit:ci --format '{{.Config.User}}')" = "node"
      - name: Hardened container smoke test
        shell: bash
        run: |
          docker run --detach \
            --name hedge-decision-cockpit-ci \
            --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --pids-limit 256 \
            --security-opt no-new-privileges:true \
            --env DATABASE_URL=file:/tmp/hedge-ci.db \
            --env PORT=3100 \
            hedge-decision-cockpit:ci >container.id
          trap 'docker logs hedge-decision-cockpit-ci >container.log 2>&1 || true; docker rm --force hedge-decision-cockpit-ci >/dev/null 2>&1 || true' EXIT
          test "$(docker exec hedge-decision-cockpit-ci id -u)" -ne 0
          test "$(docker inspect hedge-decision-cockpit-ci --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect hedge-decision-cockpit-ci --format '{{.HostConfig.CapDrop}}')" = "[ALL]"
          test "$(docker inspect hedge-decision-cockpit-ci --format '{{.HostConfig.PidsLimit}}')" = "256"
          test "$(docker inspect hedge-decision-cockpit-ci --format '{{.HostConfig.SecurityOpt}}')" = "[no-new-privileges:true]"
          SMOKE_TEST_BASE_URL=http://127.0.0.1:3100 npm run test:runtime
      - name: Upload container log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-log
          path: container.log
          if-no-files-found: ignore
