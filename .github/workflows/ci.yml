name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hedge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/hedge
      N8N_INGEST_TOKEN: test-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --silent
      - name: Generate Prisma client
        run: npm run prisma:generate >/dev/null
      - name: Apply Prisma schema
        run: npx prisma db push --skip-generate >/dev/null
      - name: Typecheck
        run: npm run typecheck >/dev/null
      - name: Lint
        run: npm run lint >/dev/null
      - name: Test
        run: npm test >/dev/null
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -n 120
