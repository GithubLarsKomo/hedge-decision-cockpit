name: Verify supply-chain attestation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download supply-chain evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name production-container-supply-chain
      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact=hedge-decision-cockpit.supply-chain-evidence.tar.gz
          log=attestation-verification.txt
          verified=false
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" >"$log" 2>&1; then
              verified=true
              break
            fi
            sleep 3
          done
          cat "$log"
          test "$verified" = true
          artifact_sha256=$(sha256sum "$artifact" | cut -d' ' -f1)
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sourceWorkflowRunId "$SOURCE_RUN_ID" \
            --arg sourceCommit "$SOURCE_HEAD_SHA" \
            --arg artifact "$artifact" \
            --arg artifactSha256 "$artifact_sha256" \
            --arg verifiedAt "$verified_at" \
            '{schemaVersion: 1, repository: $repository, sourceWorkflowRunId: $sourceWorkflowRunId, sourceCommit: $sourceCommit, artifact: $artifact, artifactSha256: $artifactSha256, verifiedAt: $verifiedAt, result: "success"}' \
            > attestation-verification.json
      - name: Validate verification evidence integrity
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          report=attestation-verification.json
          test "$(jq -r '.schemaVersion' "$report")" = "1"
          test "$(jq -r '.repository' "$report")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.sourceWorkflowRunId' "$report")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.sourceCommit' "$report")" = "$SOURCE_HEAD_SHA"
          test "$(jq -r '.artifact' "$report")" = "hedge-decision-cockpit.supply-chain-evidence.tar.gz"
          test "$(jq -r '.result' "$report")" = "success"
          jq -e '.artifactSha256 | test("^[0-9a-f]{64}$")' "$report" >/dev/null
          jq -e '.verifiedAt | fromdateiso8601' "$report" >/dev/null
          test -s attestation-verification.txt
          sha256sum attestation-verification.json attestation-verification.txt > attestation-verification.sha256
          sha256sum --check attestation-verification.sha256
      - name: Upload attestation verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-attestation-verification
          path: |
            attestation-verification.json
            attestation-verification.txt
            attestation-verification.sha256
          if-no-files-found: error
          retention-days: 30
